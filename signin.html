<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to Investment Tracker</title>
<style>
 *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#14181f;font:16px system-ui}
 main{width:min(420px,calc(100% - 32px));padding:30px;background:white;border:1px solid #e4e7ec;border-radius:12px}
 h1{font-size:24px;margin:0 0 24px}label{display:grid;gap:6px;margin:0 0 16px}
 input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #b8c1cc;width:100%}
 button{background:#0f766e;color:white;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.65}
 #error{color:#a52c16;margin:16px 0 0}#error:empty{display:none}
</style>
<main><h1>Sign in to Investment Tracker</h1>
<form action="/signin" method="post">
 <label>Email <input type="email" name="email" autocomplete="username" required></label>
 <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
 <button type="submit">Sign in</button>
 <p id="error" role="alert"></p>
</form>
<noscript>JavaScript is required to sign in and use the tracker.</noscript>
</main>
<script>
const form=document.querySelector('form');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const button=form.querySelector('button'),error=document.querySelector('#error');
 button.disabled=true;
 error.textContent='';
 try{
  const response=await fetch('/signin',{method:'POST',headers:{'Content-Type':'application/json'},
                                     body:JSON.stringify(Object.fromEntries(new FormData(form)))});
  if(!response.ok){
   const result=await response.json();
   throw new Error(result.error||'Sign-in failed.');
  }
  location.replace('/');
 }catch(problem){error.textContent=problem.message}
 finally{button.disabled=false}
});
</script>
</html>
